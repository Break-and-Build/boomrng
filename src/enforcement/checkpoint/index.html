<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Earliest possible synchronous script — plain EXTERNAL classic script
    (not inline: MV3's extension-page CSP is `script-src 'self'` and has
    never permitted inline script execution — that's what silently broke
    the original inline version of this in every real-Chrome load, since
    Continue only ever worked via getOriginalUrl()'s defensive URL-fragment
    fallback, never via this bootstrap actually running), and not
    type="module" (which defers) — placed before any stylesheet/module
    load so it still runs before anything else on the page. See
    public/enforcement-bootstrap.js (the single shared file all four
    enforcement pages load, kept in sync with
    enforcement/shared/utils.ts's computeOriginalUrlBootstrapAction()/
    applyOriginalUrlBootstrapAction() and covered by
    src/enforcement/shared/bootstrap-parity.test.ts) for the full
    BOOMRNG-V2-DESIGN-SPEC.md §30.7 rationale and semantics.
  -->
  <script src="../../../enforcement-bootstrap.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpoint — boomrng</title>
  <link rel="stylesheet" href="../shared/enforcement.css">
</head>
<body>
  <main class="enf" id="page" hidden>
    <svg class="glyph" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M14.7 6.2A6 6 0 1 1 6 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="14.8" cy="6.1" r="1" fill="currentColor" stroke="none"/>
    </svg>
    <div class="domain-chip" id="domain" hidden></div>
    <h1 id="headline"></h1>
    <p class="sub">Is that what you meant to do?</p>
    <blockquote class="reason" id="reason" hidden>
      <b>You told yourself:</b><span id="reasonText"></span>
    </blockquote>
    <div class="enf-actions">
      <button type="button" class="btn btn-primary" id="goBack">Back to what I was doing</button>
      <button type="button" class="link-btn" id="continue"></button>
      <p class="error-text" id="error" role="alert" aria-live="assertive"></p>
    </div>
  </main>
  <div class="brand">boomrng</div>
  <script type="module" src="./checkpoint.ts"></script>
</body>
</html>
