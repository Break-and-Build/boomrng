<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delay — boomrng</title>
  <link rel="stylesheet" href="../shared/enforcement.css">
</head>
<body>
  <div class="enforcement-page">
    <div class="enforcement-icon delay">⏳</div>
    <h1 class="enforcement-title">Delay</h1>
    <p class="enforcement-message">Please wait before continuing.</p>
    <div class="enforcement-domain" id="domain"></div>
    <div class="countdown" id="countdown">0:00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="enforcement-actions">
      <button class="btn btn-primary" id="continue" disabled>Continue to site</button>
      <button class="btn btn-secondary" id="goBack">Go back</button>
    </div>
  </div>
  <div class="brand">boomrng</div>
  <script type="module" src="./delay.ts"></script>
</body>
</html>
