<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Earliest possible synchronous script — plain classic script, not
    type="module" (which defers), placed before any stylesheet/module
    load. BOOMRNG-V2-DESIGN-SPEC.md §30.7: Chrome's DNR redirect briefly
    carries the original destination in the URL fragment before any page
    script can run at all; this reads it, stores it, and strips it from
    the visible URL as fast as page-controlled JS possibly can, closing
    the window as tightly as achievable without a new permission. See
    enforcement/shared/utils.ts's ORIGINAL_URL_STORAGE_KEY/getOriginalUrl()
    for the read side. validation-service.ts's validateUrl() is the
    canonical http(s)-only check reused here, and this whole snippet mirrors
    enforcement/shared/utils.ts's computeOriginalUrlBootstrapAction()/applyOriginalUrlBootstrapAction()
    (kept in sync manually — a module import is not available this early).
  -->
  <script>
    (function () {
      var KEY = 'boomrng_original_url';
      var hash = window.location.hash;
      if (hash && hash.length > 1) {
        var raw = hash.slice(1);
        var valid = null;
        try {
          var u = new URL(raw);
          if (u.protocol === 'http:' || u.protocol === 'https:') valid = raw;
        } catch (e) {}
        if (!valid) {
          try {
            var decoded = decodeURIComponent(raw);
            var u2 = new URL(decoded);
            if (u2.protocol === 'http:' || u2.protocol === 'https:') valid = decoded;
          } catch (e) {}
        }
        try {
          if (valid) {
            window.sessionStorage.setItem(KEY, valid);
          } else {
            // Present but invalid: clear rather than leave alone, so a
            // malformed fresh handoff can never inherit an unrelated
            // previous destination stored in the same tab.
            window.sessionStorage.removeItem(KEY);
          }
        } catch (e) {}
      }
      try {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIN Required — boomrng</title>
  <link rel="stylesheet" href="../shared/enforcement.css">
</head>
<body>
  <main class="enf" id="page" hidden>
    <svg class="glyph" viewBox="0 0 20 20" aria-hidden="true">
      <rect x="5" y="9" width="10" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 9V6.6a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <div class="domain-chip" id="domain" hidden></div>

    <div id="pinAvailable" hidden>
      <h1>This site requires your PIN.</h1>
      <form id="pinForm">
        <input
          type="password"
          class="pin-input"
          id="pin"
          inputmode="numeric"
          autocomplete="off"
          maxlength="6"
          placeholder="••••"
          aria-label="PIN"
          aria-describedby="error"
          aria-invalid="false"
        >
        <p class="error-text" id="error" role="alert" aria-live="assertive"></p>
        <div class="enf-actions">
          <button type="submit" class="btn btn-primary" id="submit">Verify PIN</button>
          <button type="button" class="link-btn" id="goBack">Back to what I was doing</button>
        </div>
      </form>
    </div>

    <div id="pinUnavailable" hidden>
      <h1>PIN isn&rsquo;t configured.</h1>
      <p class="sub">Set a PIN in Boomrng Settings to continue.</p>
      <div class="enf-actions">
        <button type="button" class="btn btn-primary" id="goBackUnavailable">Back to what I was doing</button>
      </div>
    </div>
  </main>
  <div class="brand">boomrng</div>
  <script type="module" src="./pin.ts"></script>
</body>
</html>
