<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIN Required — boomrng</title>
  <link rel="stylesheet" href="../shared/enforcement.css">
</head>
<body>
  <div class="enforcement-page">
    <div class="enforcement-icon pin">🔑</div>
    <h1 class="enforcement-title">PIN Required</h1>
    <p class="enforcement-message">Enter your PIN to continue to this site.</p>
    <div class="enforcement-domain" id="domain"></div>
    <input type="password" class="input" id="pin" placeholder="Enter PIN" maxlength="6" autocomplete="off">
    <div class="error-text" id="error"></div>
    <div class="enforcement-actions">
      <button class="btn btn-primary" id="submit">Verify PIN</button>
      <button class="btn btn-secondary" id="goBack">Go back</button>
    </div>
  </div>
  <div class="brand">boomrng</div>
  <script type="module" src="./pin.ts"></script>
</body>
</html>
