<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIN Required — boomrng</title>
  <link rel="stylesheet" href="../shared/enforcement.css">
</head>
<body>
  <main class="enf" id="page" hidden>
    <svg class="glyph" viewBox="0 0 20 20" aria-hidden="true">
      <rect x="5" y="9" width="10" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 9V6.6a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <div class="domain-chip" id="domain" hidden></div>

    <div id="pinAvailable" hidden>
      <h1>This site requires your PIN.</h1>
      <form id="pinForm">
        <input
          type="password"
          class="pin-input"
          id="pin"
          inputmode="numeric"
          autocomplete="off"
          maxlength="6"
          placeholder="••••"
          aria-label="PIN"
          aria-describedby="error"
          aria-invalid="false"
        >
        <p class="error-text" id="error" role="alert" aria-live="assertive"></p>
        <div class="enf-actions">
          <button type="submit" class="btn btn-primary" id="submit">Verify PIN</button>
          <button type="button" class="link-btn" id="goBack">Back to what I was doing</button>
        </div>
      </form>
    </div>

    <div id="pinUnavailable" hidden>
      <h1>PIN isn&rsquo;t configured.</h1>
      <p class="sub">Set a PIN in Boomrng Settings to continue.</p>
      <div class="enf-actions">
        <button type="button" class="btn btn-primary" id="goBackUnavailable">Back to what I was doing</button>
      </div>
    </div>
  </main>
  <div class="brand">boomrng</div>
  <script type="module" src="./pin.ts"></script>
</body>
</html>
