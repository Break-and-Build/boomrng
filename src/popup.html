<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {

            --bg: #003934;
            --accent: #00B242;
            --input-bg: #0D251D;
            --border: #234E3F;
            --text: #e0e0e0;
        }

        body {
            width: 340px;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Screen Management */
        .screen {
            display: none;
            flex-direction: column;
            padding: 25px;
            min-height: 400px;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }


        .logo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            color: #fff;
            font-weight: bold;
            letter-spacing: -1px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .logo-header img {
            width: 28px;
            height: 28px;
        }

        h2 {
            font-size: 14px;
            color: #fff;
            opacity: 0.5;
            margin-bottom: 20px;
            font-weight: normal;
        }

        label {
            font-size: 12px;
            color: var(--accent);
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.primary {
            width: 100%;
            padding: 14px;
            background: #FFFFFF;
            color: #000000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: auto;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            font-size: 14px;
            transition: 0.2s;
        }

        button.primary:hover {
            background: #e0e0e0;
        }

        button.text-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 15px;
        }

        #screen-splash {
            align-items: center;
            justify-content: center;
            min-height: 450px;
        }

        #screen-splash .logo-header {
            border: none;
            font-size: 32px;
        }

        #screen-splash img {
            width: 40px;
            height: 40px;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .site-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .site-row input[type="text"] {
            margin-bottom: 0;
            flex-grow: 1;
        }

        .site-row input.timer-input {
            width: 88px;
            margin-bottom: 0;
            text-align: center;
            padding: 10px 8px;
        }

        .timer-status {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
            margin-bottom: 8px;
            min-height: 14px;
            color: #9fdcb6;
        }

        .timer-status.warn {
            color: #ffd166;
        }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 0.6;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            height: 15px;
            text-align: center;
        }

        .status-msg {
            color: #4CAF50;
            font-size: 12px;
            min-height: 15px;
            text-align: center;
        }

        .override-panel {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.1);
        }

        .secondary-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            font-size: 12px;
        }

        .secondary-btn:hover {
            border-color: var(--accent);
        }
    </style>
</head>

<body>

    <div id="screen-splash" class="screen active">
        <div class="logo-header">
            <img src="../images/boomrng-icon.svg" alt="logo"> boomrng
        </div>
    </div>

    <div id="screen-auth" class="screen">
        <h2>Sign Up</h2>
        <div class="logo-header"><img src="../images/boomrng-icon.svg" alt="logo"> boomrng</div>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="username@mail.com">
        <label>Password</label>
        <input type="password" id="auth-pass" placeholder="••••••••">
        <button class="text-btn" id="skip-auth">Skip / Continue without Account</button>
        <button class="primary" id="btn-continue-auth" style="margin-top: 30px;">Continue</button>
    </div>

    <div id="screen-setup-pin" class="screen">
        <h2>Setup PIN</h2>
        <div class="logo-header"><img src="../images/boomrng-icon.svg" alt="logo"> boomrng</div>
        <label>Setup PIN (4-6 digits)</label>
        <input type="password" id="setup-pin-1" placeholder="••••" maxlength="6"
            style="letter-spacing: 5px; text-align: center; font-size: 18px;">
        <label>Confirm PIN</label>
        <input type="password" id="setup-pin-2" placeholder="••••" maxlength="6"
            style="letter-spacing: 5px; text-align: center; font-size: 18px;">
        <div id="setup-error" class="error-msg"></div>
        <button class="primary" id="btn-save-pin" style="margin-top: 30px;">Save PIN</button>
    </div>

    <div id="screen-enter-pin" class="screen">
        <h2>Unlock</h2>
        <div class="logo-header"><img src="../images/boomrng-icon.svg" alt="logo"> boomrng</div>
        <label>Enter PIN</label>
        <input type="password" id="unlock-pin" placeholder="••••" maxlength="6"
            style="letter-spacing: 5px; text-align: center; font-size: 18px;">
        <div id="unlock-error" class="error-msg"></div>
        <button class="primary" id="btn-unlock" style="margin-top: 30px;">Unlock Settings</button>
    </div>

    <div id="screen-settings" class="screen">
        <div class="logo-header" style="justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="../images/boomrng-icon.svg" alt="logo"> boomrng
            </div>
            <input type="checkbox" id="enabled"
                style="width: auto; transform: scale(1.3); accent-color: var(--accent);">
        </div>

        <label>Blocked Sites</label>
        <div id="blocked-sites-container">
        </div>
        <div id="timer-summary" style="font-size: 11px; opacity: 0.8; min-height: 14px;"></div>
        <div style="font-size: 11px; opacity: 0.75; margin-top: 4px;">Use minutes: blank = always blocked.</div>
        <button class="text-btn" id="btn-add-site" style="margin-top: 5px; text-align: center;">+ Add Site</button>

        <label>Allowed Sites (White-list)</label>
        <textarea id="allowed" rows="3" placeholder="localhost&#10;google.com"></textarea>

        <label>Redirect To</label>
        <input type="text" id="redirect" placeholder="https://github.com">

        <label>Max Tabs (Optional)</label>
        <input type="number" id="maxTabs" placeholder="e.g. 10">

        <div class="override-panel">
            <label style="margin-top: 0;">Bypass Active Timer</label>
            <select id="override-site"
                style="width: 100%; box-sizing: border-box; background: var(--input-bg); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 4px; font-family: 'Courier New', monospace; margin-bottom: 8px;">
            </select>
            <input type="password" id="override-pin" maxlength="6" placeholder="Enter PIN to bypass timer">
            <button class="secondary-btn" id="btn-override-timer">Override Timer</button>
            <div id="override-status" class="status-msg"></div>
        </div>

        <div id="settings-error" class="error-msg"></div>
        <button class="primary" id="save-settings" style="margin-top: 20px;">Save Settings</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
